# hyperai profile pnpm workspace: one package (the profile itself) with a
# hoisted node_modules so the dsh loader can resolve the TUI bundle from the
# profile root.
packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false

# The HyperAI-branded dsh-tui build. The patch is generated by
# `hyperai/hyperai-tui/scripts/build-patch.mjs`; the installer copies it into
# this profile's `patches/` directory. Re-running the installer rewrites the
# patch file in place, so version bumps happen through `build-patch.mjs` and the
# upstream version pinned in package.json above.
patchedDependencies:
  '@deepseek-harness-tui/dsh-tui@0.16.1': patches/hyperai-tui.patch
